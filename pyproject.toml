[project]
name = "rumoro"
version = "0.1.4"
description = "Python client for the Rumoro API: social listening for developers and AI agents."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Rumoro" }]
keywords = ["rumoro", "social listening", "brand monitoring", "api client", "openapi"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.23.1,<0.29.0",
  "attrs>=22.2.0",
]

[project.urls]
Homepage = "https://docs.rumoro.dev/sdks/python"
Documentation = "https://docs.rumoro.dev/sdks/python"
Repository = "https://github.com/rumoro-dev/sdk-python"
Issues = "https://github.com/rumoro-dev/sdk-python/issues"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rumoro"]

[tool.hatch.build.targets.sdist]
include = ["rumoro", "README.md", "pyproject.toml", "LICENSE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
